# WHERE THIS RUNS: the published mirror, under GitHub Actions -- not the
# development forge. The forge reads `.forgejo/workflows/` and, once that
# directory exists, takes nothing from `.github/`. The published branch
# carries no `.forgejo/`, so these three files are the only workflows the
# mirror has. Removing them here removes CI, the release path and Scorecard
# from the mirror at the next publication.

# OpenSSF Scorecard (#31): scores repo security posture (Branch-Protection,
# Dependency-Update-Tool, SAST, Token-Permissions, Pinned-Dependencies, …) and
# publishes the result to the Security tab + the public Scorecard API (the
# badge). Weekly + on push to main. Treat the score as a punch-list, not a
# vanity metric.
#
# NOTE (org Actions allowlist): ossf/scorecard-action and github/codeql-action
# must be allowlisted in the org's Actions policy or this workflow will
# startup_failure (same policy that makes gitleaks run as a plain `run:` step).
# If the allowlist was set org-wide during trobar-server#123 it already covers
# inconclusive.
#
# SAST caveat (this repo): CodeQL does not support Dart, so the SAST check will
# score low — dart/flutter analyze in ci.yml is the practical equivalent but
# Scorecard won't credit it. Accepted, not chased.
# Branch-Protection scoring is left inconclusive on purpose: reporting it
# fully needs a classic PAT with repo scope, and a long-lived credential
# on a public repository is not worth one line of a score.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 6 * * 1" # Mondays, 06:27 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the Scorecard API (badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
