# WHERE THIS RUNS: GitHub Actions, on this repository. `.github/workflows/`
# holds three files -- ci.yml, release.yml and scorecard.yml -- and they are
# every workflow this repository has. Deleting one deletes CI, the release
# path or Scorecard outright: nothing else here would pick that work up.

# Release: fires on a bare vX.Y.Z tag.
#
# Tags are bare `vX.Y.Z`.
#
# NO KEYSTORE IN CI. This workflow deliberately does not build a shippable
# artifact. The signing key exists only on the maintainer's machine, and
# android/app/build.gradle.kts pins its fingerprint — same posture as
# trobar-android. An APK built here would be unsigned, and an unsigned APK
# cannot be installed, so publishing one would be worse than publishing none.
#
# What this does instead: proves the tag is honest, runs every gate, and opens
# a DRAFT release for the maintainer to attach the locally-signed APK to. The
# draft is the handoff point — nothing is public until a human publishes it.
#
# TAG PUSHES: tag creation is restricted, so whoever cuts a release needs
# permission to create the tag that triggers this.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to re-run against. Leave blank to check the current ref only."
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Runs BEFORE the gates. A tag that disagrees with pubspec is wrong no matter
  # how green the tests are, and finding that out first is cheaper.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag must match pubspec.yaml
        # trobar-desktop parses its tag only to name artifacts, falling back to
        # "dev" on a mismatch — so nothing there stops a v1.2.0 tag building
        # from a pubspec that says 1.1.0. On Android that lands harder:
        # versionName comes from pubspec, so the advertised and installed
        # versions disagree, and versionCode drives update eligibility.
        run: |
          ref="${{ inputs.tag }}"; [ -z "$ref" ] && ref="$GITHUB_REF_NAME"
          case "$ref" in
            v*) ;;
            *) echo "::error::tag '$ref' does not start with 'v' — Garfin uses bare vX.Y.Z"; exit 1 ;;
          esac
          tag_version="${ref#v}"
          # pubspec is `version: X.Y.Z+BUILD`; compare the X.Y.Z part only.
          pubspec_full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          pubspec_version="${pubspec_full%%+*}"
          echo "tag=$tag_version  pubspec=$pubspec_full"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::tag $ref implies version $tag_version but pubspec.yaml says $pubspec_version — bump pubspec or retag"
            exit 1
          fi
          if [ -z "${pubspec_full##*+}" ] || [ "$pubspec_full" = "$pubspec_version" ]; then
            echo "::error::pubspec version '$pubspec_full' has no +BUILD suffix; versionCode would be unset"
            exit 1
          fi

  # The same ten gates a PR runs — called, not copied, so they cannot drift.
  gates:
    needs: [version-check]
    uses: ./.github/workflows/ci.yml

  draft-release:
    needs: [version-check, gates]
    runs-on: ubuntu-latest
    # Only this job needs write, and only to create the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release notes from CHANGELOG.md
        # The CHANGELOG is the release notes; its wording is reviewed in the
        # version-bump PR. --generate-notes had no pull requests to read on
        # this curated repository, so it produced only a compare link. A tag
        # whose CHANGELOG has no entry is refused, as version-check refuses a
        # tag that disagrees with pubspec.yaml.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          # The lines under `## X.Y.Z` up to the next `## ` heading, without
          # the heading and without blank lines at either end.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) found = 1; next }
            found && (n || NF) { line[++n] = $0 }
            END { while (n && line[n] ~ /^[[:space:]]*$/) n--
                  for (i = 1; i <= n; i++) print line[i] }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## $version' section, or it is empty — write the release's entry before tagging"
            exit 1
          fi
          # The previous release is the next version heading down, not
          # `git describe`: this checkout has depth 1, so no earlier tag exists
          # in it.
          prev=$(awk -v v="$version" '
            /^## / { if (found) { print $2; exit } if ($2 == v) found = 1 }
          ' CHANGELOG.md)
          {
            echo
            echo "Install the APK for your device's ABI; Obtainium users get it automatically."
            case "$prev" in
              [0-9]*)
                echo
                echo "Changes since v$prev: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/v$prev...$TAG"
                ;;
            esac
          } >> "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          cat "$notes"
      - name: Create or update the draft release
        # `gh` in a run: step rather than a third-party release action — the org
        # Actions policy allows GitHub-owned and verified-creator actions only.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"
            notes_line="The release already existed, so its notes were left as they are."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --draft --notes-file "$NOTES_FILE"
            notes_line="The notes are the \`${TAG#v}\` section of \`CHANGELOG.md\`, followed by the install line and, when an earlier release is listed there, the compare link."
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ### $TAG — draft release created

          Tag matches \`pubspec.yaml\`, and all gates passed.

          $notes_line

          **No artifact is attached, by design.** The release APK is built and
          signed as part of the project's release process and attached before
          this draft is published — a build produced here could not be signed
          with the release key.

          The signing guard in \`android/app/build.gradle.kts\` verifies the key
          fingerprint on that build and fails if it does not match. Publish only
          once the APK is attached.
          SUMMARY
