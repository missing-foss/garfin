name: garfin
description: "Tag-based parental controls for Jellyfin, from your phone."
# Garfin is a GPL-3.0-or-later application, not a pub package.
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.12.2
  # `SnackBar.persist` — the fix — does not exist in older Flutters, and
  # without a floor an older toolchain fails at compile time with a message that
  # says nothing about why. 3.44.8 is what it was measured on.
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # EN + FR. `intl: any` is deliberate — flutter_localizations pins the
  # version it needs, and a tighter constraint here just fights it.
  flutter_localizations:
    sdk: flutter
  intl: any

  # HTTP. No generated Jellyfin SDK — the surface we need is small, and dio's
  # interceptors give us one place to attach the MediaBrowser auth header.
  dio: ^5.11.0

  # State. The Jellyfin client lives in a repository layer; widgets never call HTTP.
  flutter_riverpod: ^3.4.2

  # Settings only. The access token goes in flutter_secure_storage, never here.
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # Material You on Android 12+; degrades to the seed scheme below it.
  dynamic_color: ^1.8.1

  # Posters. Cache key must include the item's ImageTag so a changed poster invalidates.
  cached_network_image: ^3.4.1

  # No print() anywhere — and never log tokens, passwords, or Quick Connect secrets.
  logging: ^1.3.0
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  diacritic: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  # Required by gen-l10n to emit lib/l10n/gen/app_localizations.dart.
  generate: true
  uses-material-design: true

  assets:
    # FreeDroidWarn's licence, shipped so the in-app licence page can show it.
    # It is an Android library pulled by Gradle, not a pub package, so it never
    # reaches `LicenseRegistry` on its own and `main.dart` registers it by hand.
    #
    # Here rather than in LICENSES/: that directory is REUSE's, for licences
    # that files in *this* repository are under, and nothing here is Apache-2.0
    # — the library is redistributed as a binary, not vendored. Same shape as
    # `assets/fonts/OFL-Fredoka.txt`, which ships beside the font it covers.
    - assets/licences/
    - assets/fonts/
    # The mark, for the About screen. Output of brand/make-app-assets.sh — the
    # SVG in brand/svg/ is the source. Declaring the directory picks up the
    # 2.0x/ and 3.0x/ variants automatically.
    - assets/brand/

  # The three text families are SIL OFL 1.1 and Phosphor is MIT, so the bundled
  # fonts impose no licence constraint of their own. Each licence ships beside
  # its font. Variable fonts: wght is driven by TextStyle.fontWeight.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
    # Icons for the item sheet (#166): @phosphor-icons/web 2.1.1, regular weight,
    # subset to the glyphs used. How to re-cut it: lib/widgets/phosphor_glyphs.dart.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
