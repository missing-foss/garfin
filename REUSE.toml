# REUSE (https://reuse.software) licensing for files that can't carry an inline
# SPDX header — binaries, fonts, generated code, JSON/no-comment formats, and the
# Flutter-generated native platform scaffolding. First-party source files carry
# their own header instead.
version = 1

# --- Flutter-generated native platform scaffolding -------------------------
# `flutter create` boilerplate under android/. Attributed to its upstream
# provenance rather than claimed as first-party. Files we've since taken
# ownership of (build.gradle.kts) carry their own SPDX header, which wins over
# this aggregate entry. Garfin is Android-only — there is no ios/ tree.
[[annotations]]
path = ["android/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Flutter Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# --- Bundled fonts, all SIL OFL 1.1 ----------------------------------------
# Variable .ttf binaries plus the licence text each ships with. Roboto Mono was
# relicensed from Apache-2.0 to OFL-1.1 upstream, so the whole bundled stack is
# OFL and the fonts impose no licence constraint of their own — see BRANDING.md.
# That is all this establishes: other Apache-2.0 components ship in the APK, so
# it says nothing about which licences remain available to the project.
[[annotations]]
path = ["assets/fonts/Fredoka.ttf", "assets/fonts/OFL-Fredoka.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Fredoka Project Authors (https://github.com/hafontia/Fredoka-One)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "assets/fonts/Nunito.ttf",
  "assets/fonts/Nunito-Italic.ttf",
  "assets/fonts/OFL-Nunito.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 The Nunito Project Authors (https://github.com/googlefonts/nunito)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/RobotoMono.ttf", "assets/fonts/OFL-RobotoMono.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors (https://github.com/googlefonts/robotomono)"
SPDX-License-Identifier = "OFL-1.1"

# --- Brand artwork: CC BY-SA 4.0, deliberately NOT GPL ---------------------
# Copyleft on a logo would let anyone ship a modified app under Garfin's mark.
# Forks are welcome; they should rename. See BRANDING.md. brand/outline.sh is a
# build script rather than artwork and carries its own GPL header.
[[annotations]]
path = ["brand/svg/**", "brand/garfin-design-pack.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- First-party translations, generated output, locks, and misc config -----
# ARB is JSON (no comments); lib/l10n/gen is generated from those ARB files;
# pubspec.lock / .metadata / .gitignore carry no header. ui-mockup.jsx is a
# visual reference, not source — see CLAUDE.md. All first-party.
[[annotations]]
path = [
  "lib/l10n/app_en.arb",
  "lib/l10n/app_fr.arb",
  "lib/l10n/gen/**",
  "docs/ui-mockup.jsx",
  "pubspec.lock",
  ".metadata",
  "**/.gitignore",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# dev/forbidden-terms.txt is fed to grep -f as literal patterns, so no inline
# header — a comment line would itself become a search pattern.
[[annotations]]
path = "dev/forbidden-terms.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"
